<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Herald pays ambassadors and creators from a DAO treasury. Trusted creators are paid automatically, everyone else gets a reviewer, and big asks go to a DAO vote." />
    <meta name="theme-color" content="#F5F2ED" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Herald: ambassador payouts on NEAR</title>
    <!-- The card X, Telegram and others show for a shared link. og.png is the home page hero (docs/assets/banner.png). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Herald" />
    <meta property="og:url" content="https://herald.cash/" />
    <meta property="og:title" content="Herald: pay the people who carry your message" />
    <meta property="og:description" content="Ambassador and creator payouts from a DAO treasury on NEAR. Proven creators are paid automatically, newcomers get one reviewer, and big asks go to a DAO vote." />
    <meta property="og:image" content="https://herald.cash/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Herald: Pay the people who carry your message. A payout receipt for 0.4 NEAR, stamped DAO vote." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Herald: pay the people who carry your message" />
    <meta name="twitter:description" content="Ambassador and creator payouts from a DAO treasury on NEAR. Proven creators are paid automatically, newcomers get one reviewer, and big asks go to a DAO vote." />
    <meta name="twitter:image" content="https://herald.cash/og.png" />
    <meta name="twitter:image:alt" content="Herald: Pay the people who carry your message. A payout receipt for 0.4 NEAR, stamped DAO vote." />
    <style>
      /*
       * Boot screen, drawn before the app's code arrives: the monogram, still, on the page color,
       * over a gilt hairline that light runs along. It appears only if loading takes a moment, and
       * the app fades it out once it has drawn itself (src/lib/boot.ts).
       */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 60;
        display: grid;
        place-items: center;
        background: #f5f2ed;
        opacity: 0;
        animation: boot-in 0.4s 0.35s ease-out forwards;
      }
      #boot .boot-mark {
        display: grid;
        justify-items: center;
        gap: 22px;
      }
      #boot svg {
        width: 44px;
        height: 44px;
      }
      #boot .boot-line {
        position: relative;
        width: 88px;
        height: 1px;
        overflow: hidden;
        background: #e4ded5;
      }
      #boot .boot-line::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 45%;
        background: linear-gradient(90deg, transparent, #a9844a, transparent);
        animation: boot-sweep 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      #boot .boot-label {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      @keyframes boot-in {
        to { opacity: 1; }
      }
      @keyframes boot-sweep {
        from { transform: translateX(-100%); }
        to { transform: translateX(225%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot { animation-duration: 0s; }
        #boot .boot-line::after { animation: none; transform: translateX(62%); }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status">
      <span class="boot-label">Loading Herald</span>
      <div class="boot-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64">
          <circle cx="32" cy="32" r="29" fill="#211c17" />
          <circle cx="32" cy="32" r="22" fill="none" stroke="#a9844a" stroke-width="2" stroke-dasharray="3 3" />
          <path d="M22 20v24M42 20v24M22 32h20" fill="none" stroke="#f5f2ed" stroke-width="5" stroke-linecap="round" />
        </svg>
        <span class="boot-line"></span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
