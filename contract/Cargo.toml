[package]
name = "herald"
version = "1.0.0"
edition = "2021"
description = "Ambassador and creator payouts that earn trust, on top of a Sputnik DAO treasury"
license = "MIT"
repository = "https://github.com/adexyz0x/herald"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
near-workspaces = { version = "0.24", features = ["unstable"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"
base64 = "0.22"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
